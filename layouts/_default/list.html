{{ define "main" }}
<article class="blog-list">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="description">{{ . }}</p>{{ end }}
  </header>
  <ul class="post-list">
    {{ range .Pages }}
    <li class="post-item">
      <a href="{{ .Permalink }}">
        <span class="post-title">{{ .Title }}</span>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      </a>
    </li>
    {{ end }}
  </ul>
</article>
{{ end }}
