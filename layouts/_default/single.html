{{ define "main" }}
<article class="blog-post">
  {{- partial "breadcrumbs.html" . -}}
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" | lower }}</time>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <footer class="post-footer">
    {{- with .Params.tags }}
    <div class="post-tags">{{ range $i, $tag := . }}{{- if $i }} {{ end }}<a href="{{ "/tags/" | relURL }}{{ $tag | urlize }}/">#{{ $tag }}</a>{{ end }}</div>
    {{- end }}
  </footer>
</article>
{{ end }}
