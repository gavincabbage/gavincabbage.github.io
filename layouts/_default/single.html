{{ define "main" }}
<article class="blog-post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <footer class="post-footer">
    {{- with .Params.tags }}
    <div class="post-tags">{{ range $i, $tag := . }}{{- if $i }} {{ end }}<a href="{{ "/tags/" | relURL }}{{ $tag | urlize }}/">#{{ $tag }}</a>{{ end }}</div>
    {{- end }}
    <a href="/stuff/" class="nav-link">&larr; Back</a>
  </footer>
</article>
{{ end }}
